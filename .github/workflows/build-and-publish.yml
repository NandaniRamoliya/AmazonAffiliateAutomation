name: Build & Publish Affiliate Content

on:
  push:
    branches: ["main"]
    paths:
      - "data/products.json"
      - "scripts/**"
  schedule:
    # Runs daily at 03:00 UTC (08:30 IST)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run affiliate content pipeline
        env:
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_MARKETPLACE: ${{ vars.AMAZON_MARKETPLACE || 'amazon.in' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/build_pipeline.py

      - name: Commit generated site, cards, and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/posted_ids.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update affiliate deals page and content cards"
            git push
          else
            echo "No changes to commit."
          fi
